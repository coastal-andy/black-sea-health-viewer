<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coast and seabed, direction B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06131D}
a{color:#4CC3E6}a:hover{color:#8ADBF2}
</style>
</helmet>
<div style="height: 900px; display: flex; font-family: 'Barlow', system-ui, sans-serif; color: #E6EEF3; background: #06131D; font-variant-numeric: tabular-nums; overflow: hidden">

  <nav aria-label="Pages" style="width: 72px; flex: 0 0 72px; background: #0A1B27; border-right: 1px solid #1E3646; display: flex; flex-direction: column; padding-top: 10px; gap: 2px">
    <div style="height: 52px; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 28 28" role="img" aria-label="Black Sea Health"><circle cx="14" cy="14" r="12.5" fill="none" stroke="#4CC3E6" stroke-width="1.5"></circle><path d="M4 16 C8 12 11 20 15 16 S22 12 24 15" fill="none" stroke="#4CC3E6" stroke-width="2"></path></svg>
    </div>
    <a href="OverviewB.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: #8FA7B6; font-size: 10.5px; letter-spacing: 0.4px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 5 L8 3 L14 5 L20 3 V17 L14 19 L8 17 L2 19 Z M8 3 V17 M14 5 V19" fill="none" stroke="#8FA7B6" stroke-width="1.6"></path></svg>Overview</a>
    <a href="WaterB.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: #8FA7B6; font-size: 10.5px; letter-spacing: 0.4px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2 C11 2 4 10 4 14 A7 7 0 0 0 18 14 C18 10 11 2 11 2 Z" fill="none" stroke="#8FA7B6" stroke-width="1.6"></path></svg>Water</a>
    <a href="SeabedB.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: #E6EEF3; background: #13293A; font-size: 10.5px; letter-spacing: 0.4px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 8 C5 5 8 11 11 8 S17 5 20 8 M2 13 C5 10 8 16 11 13 S17 10 20 13 M2 19 L8 16 L14 18 L20 15" fill="none" stroke="#4CC3E6" stroke-width="1.6"></path></svg>Seabed</a>
    <a href="PressuresB.dc.html" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: #8FA7B6; font-size: 10.5px; letter-spacing: 0.4px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="none" stroke="#8FA7B6" stroke-width="1.6"></rect><rect x="9" y="9" width="10" height="10" fill="none" stroke="#8FA7B6" stroke-width="1.6"></rect></svg>Pressures</a>
    <a href="#" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: #8FA7B6; font-size: 10.5px; letter-spacing: 0.4px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 4 H18 M4 9 H18 M4 14 H13 M4 19 H10" fill="none" stroke="#8FA7B6" stroke-width="1.6"></path></svg>Methods</a>
  </nav>

  <main style="position: relative; flex: 1 1 auto; min-width: 0; background: #0B2A3D">
    <svg role="img" aria-label="Wave field off the Romanian coast: colour is wave height, arrows show direction, arrow length shows wave period" width="100%" height="100%" viewBox="-120 150 1000 860" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; display: block">
      <defs>
        <linearGradient id="shs" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0E3550"></stop>
          <stop offset="0.5" stop-color="#1D5F86"></stop>
          <stop offset="1" stop-color="#3E8FB8"></stop>
        </linearGradient>
      </defs>
      <rect x="-300" y="0" width="1500" height="1100" fill="url(#shs)"></rect>
      <g fill="none" stroke="#9FD3E8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 5">
        <path d="M600,60 L640,180 L600,330 L470,420 L330,520 L230,640 L215,760 L205,900 L190,1026"></path>
        <path d="M760,40 L800,250 L700,400 L560,520 L420,640 L360,800 L330,1026"></path>
        <path d="M980,0 L1000,300 L900,560 L760,800 L700,1026"></path>
      </g>
      <g font-family="Barlow Condensed" font-size="12" fill="#9FD3E8" fill-opacity="0.6"><text x="214" y="880">20 m</text><text x="368" y="780">50 m</text><text x="790" y="760">100 m</text></g>
      <sc-for list="{{arrows}}" as="a" hint-placeholder-count="40">
        <path d="{{a.d}}" transform="{{a.t}}" fill="none" stroke="#E6EEF3" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <path d="M-300,0 L560,0 L577,27 L608,135 L589,184 L570,243 L547,329 L423,378 L308,437 L250,529 L185,626 L166,675 L180,712 L192,722 L177,730 L173,778 L166,837 L150,913 L146,945 L146,1026 L-300,1026 Z" fill="#16242D" stroke="#4A6676" stroke-width="1.2"></path>
      <path d="M290,440 L330,360 L400,310 L470,315 L430,360 L340,415 Z" fill="#0E3045" stroke="#4A6676" stroke-width="0.8"></path>
      <line x1="182" y1="718" x2="560" y2="718" stroke="#F2B134" stroke-width="2" stroke-dasharray="7 5"></line>
      <circle cx="182" cy="718" r="4" fill="#F2B134"></circle><circle cx="560" cy="718" r="4" fill="#F2B134"></circle>
      <text x="120" y="722" font-family="Barlow" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="end">Constanța</text>
    </svg>

    <div role="group" aria-label="Field" style="position: absolute; left: 16px; top: 16px; display: flex; background: rgba(10,27,39,0.9); border: 1px solid #2A4558; border-radius: 4px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <button type="button" aria-label="Full-screen map" style="position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border: 1px solid #2A4558; border-radius: 4px; background: rgba(10,27,39,0.9); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7 V2 H7 M11 2 H16 V7 M16 11 V16 H11 M7 16 H2 V11" fill="none" stroke="#E6EEF3" stroke-width="1.6"></path></svg>
    </button>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: flex-end; padding: 0 16px 10px">
        <div style="background: rgba(10,27,39,0.9); border: 1px solid #2A4558; border-radius: 4px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; width: 230px">
          <span style="font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #8FA7B6">{{legendTitle}}</span>
          <span style="height: 6px; background: linear-gradient(90deg, #0E3550, #1D5F86, #3E8FB8)"></span>
          <span style="font-size: 12px; color: #A9BDCA">Arrow = direction · length = wave period</span>
        </div>
      </div>
      <div style="background: rgba(6,19,29,0.96); border-top: 1px solid #1E3646">
        <button type="button" onClick="{{toggleProfile}}" aria-expanded="{{profileStr}}" style="font: inherit; color: #E6EEF3; width: 100%; height: 52px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 0 18px; text-align: left">
          <span style="width: 18px; border-top: 2px dashed #F2B134"></span>
          <span style="font-size: 14px; font-weight: 500">Depth profile along the line</span>
          <span style="font-size: 12.5px; color: #8FA7B6">Constanța to open sea · EMODnet Bathymetry</span>
          <span style="margin-left: auto; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #8FA7B6">{{profileLabel}}</span>
        </button>
        <sc-if value="{{profileOpen}}" hint-placeholder-val="{{ false }}">
          <svg role="img" aria-label="Seabed depth profile: shallow near the coast and deepening gently offshore" viewBox="0 0 1200 170" width="100%" style="display: block; padding: 0 0 10px">
            <g font-family="Barlow Condensed" font-size="12" fill="#8FA7B6">
              <text x="44" y="24" text-anchor="end">0 m</text><text x="44" y="84" text-anchor="end">-30</text><text x="44" y="144" text-anchor="end">-60</text>
              <text x="56" y="164">coast</text><text x="1180" y="164" text-anchor="end">[ ] km</text>
            </g>
            <line x1="56" y1="20" x2="1180" y2="20" stroke="#4CC3E6" stroke-width="1"></line>
            <path d="M56,20 C120,30 200,56 320,64 S560,86 760,100 S1050,118 1180,130 L1180,150 L56,150 Z" fill="#1A2C36"></path>
            <path d="M56,20 C120,30 200,56 320,64 S560,86 760,100 S1050,118 1180,130" fill="none" stroke="#7FA3B0" stroke-width="1.8"></path>
            <text x="64" y="44" font-family="Barlow" font-size="12" fill="#C9D7E0">shallow strip: warms fast, waves reach the seabed</text>
          </svg>
        </sc-if>
      </div>
    </div>
  </main>

  <aside aria-label="Sea state" style="width: 360px; flex: 0 0 360px; background: #0C1F2C; border-left: 1px solid #1E3646; display: flex; flex-direction: column; overflow-y: auto">
    <div style="padding: 20px 22px 16px; border-bottom: 1px solid #1E3646; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #8FA7B6">Sea state · today 12:00</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 500; line-height: 1">Constanța offshore</h1>
      <p style="margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: #A9BDCA">How the water moves and how deep it is. Values fill in from the models at build time.</p>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="border-bottom: 1px solid #16303F; background: {{r.bg}}">
        <button type="button" onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" style="font: inherit; color: inherit; width: 100%; border: 0; background: transparent; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto 12px; gap: 2px 12px; align-items: baseline; padding: 14px 18px 14px 22px; text-align: left">
          <span style="font-size: 14.5px; font-weight: 500">{{r.title}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 500; white-space: nowrap">{{r.value}}</span>
          <span style="font-size: 12px; color: #8FA7B6">{{r.chev}}</span>
          <span style="font-size: 12.5px; color: #A9BDCA">{{r.sub}}</span>
          <span style="font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: #8FA7B6; text-align: right">{{r.origin}}</span>
          <span></span>
        </button>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 0 22px 14px; font-size: 13px; line-height: 1.5; color: #C9D7E0">{{r.why}}</p>
        </sc-if>
      </div>
    </sc-for>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { field: 0, open: 0, profile: true };
  }
  renderVals() {
    const coast = [[184,589],[243,570],[329,547],[378,423],[437,308],[529,250],[626,185],[675,166],[778,173],[837,166],[913,150],[1026,146]];
    const coastX = (y) => {
      for (let i = 1; i < coast.length; i++) {
        const a = coast[i - 1], b = coast[i];
        if (y <= b[0]) return a[1] + (b[1] - a[1]) * (y - a[0]) / (b[0] - a[0]);
      }
      return 146;
    };
    const arrows = [];
    for (let y = 230; y <= 960; y += 70) {
      for (let x = 220; x <= 880; x += 80) {
        if (x < coastX(y) + 40) continue;
        const off = Math.min(1, (x - coastX(y)) / 600);
        const len = 8 + 9 * off;
        const ang = 32 + 10 * Math.sin(y / 140);
        arrows.push({
          t: 'translate(' + x + ',' + y + ') rotate(' + ang.toFixed(1) + ')',
          d: 'M0,' + (-len).toFixed(1) + ' L0,' + len.toFixed(1) + ' M-4,' + (len - 5).toFixed(1) + ' L0,' + len.toFixed(1) + ' L4,' + (len - 5).toFixed(1)
        });
      }
    }
    const F = ['Waves', 'Currents', 'Wind', 'Depth'];
    const legends = ['Wave height, m · model', 'Current speed, m/s · model', 'Wind speed, m/s · model', 'Depth, m · EMODnet'];
    const fields = F.map((l, i) => ({
      label: l, pressed: i === this.state.field ? 'true' : 'false',
      pick: () => this.setState({ field: i }),
      style: 'font: inherit; font-size: 13px; height: 40px; padding: 0 16px; border: 0; cursor: pointer; ' + (i < 3 ? 'border-right: 1px solid #2A4558; ' : '') +
        (i === this.state.field ? 'background: #13293A; color: #FFFFFF; box-shadow: inset 0 -2px 0 #4CC3E6' : 'background: transparent; color: #8FA7B6')
    }));
    const D = [
      ['Waves', '[ ] m · [ ] s', 'height · period · from [NE]', 'model', 'Waves stir up the seabed in shallow water and make it murky. Long-period swell reaches deeper than short wind waves.'],
      ['Surface current', '[ ] m/s', 'flowing towards [S]', 'model', 'The coastal current carries Danube water south along the coast, with its nutrients and mud.'],
      ['Wind', '[ ] m/s', 'from [N]', 'model', 'Strong offshore wind can pull cold deep water up to the surface (upwelling), which drops temperature fast.'],
      ['Seabed depth here', '[ ] m', 'EMODnet Bathymetry DTM', 'measured', 'Shallow water warms and loses oxygen faster than deep water; the shelf here deepens slowly.']
    ];
    const rows = D.map((d, i) => {
      const open = this.state.open === i;
      return { title: d[0], value: d[1], sub: d[2], origin: d[3], why: d[4], open, expanded: open ? 'true' : 'false', chev: open ? '▾' : '▸', bg: open ? '#102838' : 'transparent',
        toggle: () => this.setState({ open: open ? -1 : i }) };
    });
    return {
      arrows, fields, rows,
      legendTitle: legends[this.state.field],
      profileOpen: this.state.profile,
      profileStr: this.state.profile ? 'true' : 'false',
      profileLabel: this.state.profile ? 'Hide' : 'Show',
      toggleProfile: () => this.setState({ profile: !this.state.profile })
    };
  }
}
</script>
</body>
</html>
