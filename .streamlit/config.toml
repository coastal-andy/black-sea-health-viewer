# Direction B. The dark theme is the base for native widgets; the in-app Dark/Light switch
# (src/viewer/style.py, THEMES) injects matching CSS, so in light mode the widgets are restyled by CSS.
[theme]
base = "dark"
primaryColor = "#4CC3E6"
backgroundColor = "#06131D"
secondaryBackgroundColor = "#0C1F2C"
textColor = "#E6EEF3"
borderColor = "#2A4558"
font = "sans serif"
baseRadius = "small"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0A1B27"
secondaryBackgroundColor = "#0C1F2C"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
